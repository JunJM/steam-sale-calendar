<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171d25" />
    <title>Steam 할인 캘린더</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header"><a href="./" class="brand">STEAM <span>할인 캘린더</span></a><p>친구와 함께 확인하는 공식 할인 일정</p></header>
    <main>
      <section class="calendar-card" aria-labelledby="month-title">
        <div class="calendar-toolbar"><button id="previous" aria-label="이전 달">‹</button><h1 id="month-title"></h1><button id="next" aria-label="다음 달">›</button></div>
        <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div id="calendar" class="calendar" aria-live="polite"></div>
      </section>
      <aside id="detail" class="detail-card" aria-live="polite"><div class="empty-state"><h2>할인 일정을 선택하세요</h2><p>달력의 이벤트를 누르면 기간과 대표 게임을 볼 수 있어요.</p></div></aside>
    </main>
    <footer><span id="updated"></span><a href="https://partner.steamgames.com/doc/marketing/upcoming_events" target="_blank" rel="noreferrer">Steam 공식 예정 행사</a></footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
